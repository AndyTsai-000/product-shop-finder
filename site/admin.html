<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>產品找店家後台</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 後台：上方分頁（狀態／使用者／修改紀錄），內容是一欄卡片列表，手機也能用 */
:root{
  --bg:#f3f5f4; --card:#ffffff; --ink:#18201d; --sub:#5d6964; --line:#dbe1de;
  --accent:#1d6b57; --accent-ink:#ffffff; --accent-soft:#e1efe9; --warn:#b3402e;
  --s-call:#2f6fb0; --s-visit:#8a5cb8; --s-no:#7a7f7c; --s-deal:#1f8a4c;
  --font:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121715; --card:#1b2220; --ink:#e7ece9; --sub:#9aa7a1; --line:#2d3733;
    --accent:#62c4a7; --accent-ink:#0b1714; --accent-soft:#1d322b; --warn:#ef8a75;
    --s-call:#6fa8e6; --s-visit:#b892e0; --s-no:#9aa29e; --s-deal:#5cc68a; color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font)}
.wrap{max-width:860px;margin:0 auto;padding-block:24px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0}
h1 a{color:inherit;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input{flex:1 1 180px}
.btn{font:inherit;font-size:14px;border:1px solid var(--accent);border-radius:8px;padding:6px 14px;background:transparent;color:var(--accent);cursor:pointer;white-space:nowrap}
.btn.solid{background:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn.danger.sure{background:var(--warn);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--warn);font-size:14px;margin:0;min-height:1.2em}
.hint{color:var(--sub);font-size:13px;margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{font:inherit;background:none;border:0;border-bottom:2px solid transparent;color:var(--sub);padding:8px 12px;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item b{font-weight:500;min-width:0;word-break:break-word}
.meta{grid-column:1/-1;font-size:13px;color:var(--sub);min-width:0;word-break:break-word}
.ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.pill{font-size:12px;border-radius:999px;padding:1px 10px;color:var(--accent-ink);background:var(--st,var(--sub));align-self:start;white-space:nowrap}
.s-call{--st:var(--s-call)} .s-visit{--st:var(--s-visit)} .s-no{--st:var(--s-no)} .s-deal{--st:var(--s-deal)} .s-{--st:var(--warn)}
.off b{color:var(--sub);text-decoration:line-through}
.num{font-variant-numeric:tabular-nums}
.empty{color:var(--sub);font-size:14px;padding:8px 0}
.more{align-self:center}
.acct{display:flex;flex-direction:column;gap:4px;max-width:260px}
.acct label{margin-top:6px;font-size:12px}
.acct input,.acct .pw{flex:none}
.acct input{padding:5px 9px;font-size:14px}
.acct .btn{align-self:flex-start;margin-top:10px}
.pw{position:relative;display:flex;flex:1 1 180px;min-width:0}
.pw input{flex:1;padding-right:36px;width:100%}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--sub);
  width:28px;height:28px;display:grid;place-items:center;cursor:pointer;border-radius:6px;padding:0}
.eye:hover{color:var(--ink)}
.eye:focus-visible{outline:2px solid var(--accent)}
.eye svg{width:18px;height:18px}
.rng{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}
.rng.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rng:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.edit{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.edit input{flex:0 1 120px;padding:5px 8px;font-size:14px}
.edit input.nm{flex:1 1 120px}
.edit select{padding:5px 8px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><a href="./">產品找店家</a>・後台</h1>
    <button class="btn" id="logoutBtn" hidden>登出後台</button>
  </header>

  <section class="card" id="gate" hidden>
    <h2 style="font-size:18px;margin:0">管理員登入</h2>
    <form class="row" id="loginForm">
      <input id="un" placeholder="使用者名稱" autocomplete="username" aria-label="使用者名稱" style="flex:0 1 160px">
      <input type="password" id="pw" placeholder="密碼" autocomplete="current-password" aria-label="密碼">
      <button class="btn solid" id="loginBtn">登入</button>
    </form>
    <p class="err" id="loginErr" role="alert"></p>
  </section>

  <main id="app" hidden style="display:flex;flex-direction:column;gap:14px">
    <nav class="tabs" role="tablist">
      <button class="tab on" data-tab="status" role="tab">狀態</button>
      <button class="tab" data-tab="users" role="tab">使用者</button>
      <button class="tab" data-tab="log" role="tab">修改紀錄</button>
      <button class="tab" data-tab="acct" role="tab">帳號設定</button>
    </nav>
    <p class="err" id="msg" role="alert"></p>

    <section class="card" id="tab-status">
      <div class="row">
        <select id="fProd" aria-label="產品"></select>
        <select id="fStatus" aria-label="狀態"></select>
        <input id="fText" placeholder="搜尋店家、地址、標記人" aria-label="搜尋">
      </div>
      <p class="hint" id="statusSum"></p>
      <div class="list" id="statusList"></div>
      <button class="btn more" id="statusMore" hidden>顯示更多</button>
    </section>

    <section class="card" id="tab-users" hidden>
      <form class="row" id="userForm">
        <input id="newId" placeholder="使用者編號" maxlength="20" aria-label="使用者編號" style="flex:0 1 130px">
        <input id="newName" placeholder="姓名" maxlength="20" aria-label="姓名" style="flex:1 1 120px">
        <select id="newRole" aria-label="權限"></select>
        <button class="btn solid">新增</button>
      </form>
      <p class="hint">同事用「使用者編號＋姓名」登入。權限：主管＝可修改所有人的標記；一般＝只能修改自己標的；檢視＝只能查看；停用＝不能登入（立刻生效，之前標的狀態會保留）。改了編號或姓名，他標過的狀態會一起更新，不用重新登入。</p>
      <div class="list" id="userList"></div>
    </section>

    <section class="card" id="tab-acct" hidden>
      <h2 style="font-size:17px;margin:0">後台帳號</h2>
      <p class="hint">目前的使用者名稱：<b id="acctName"></b>。修改後，其他已登入後台的裝置會被登出。</p>
      <form id="acctForm" class="acct">
        <label class="hint" for="acctUser">新的使用者名稱</label>
        <input id="acctUser" maxlength="40" autocomplete="username">
        <label class="hint" for="acctPw">新密碼（不改就留空，至少 6 個字）</label>
        <input type="password" id="acctPw" maxlength="100" autocomplete="new-password">
        <label class="hint" for="acctPw2">再輸入一次新密碼</label>
        <input type="password" id="acctPw2" maxlength="100" autocomplete="new-password">
        <label class="hint" for="acctCur">目前的密碼（確認是你本人）</label>
        <input type="password" id="acctCur" maxlength="100" autocomplete="current-password">
        <button class="btn solid" id="acctSave">儲存</button>
        <p class="err" id="acctMsg" role="status"></p>
      </form>
    </section>

    <section class="card" id="tab-log" hidden>
      <p class="hint">每一次標記、修改、取消都會留下紀錄（新的在前）。</p>
      <div class="row" id="logRange" role="group" aria-label="時間範圍"></div>
      <div class="row" style="justify-content:space-between">
        <p class="hint" id="logSum"></p>
        <button class="btn danger" id="logClear">清除紀錄</button>
      </div>
      <div class="list" id="logList"></div>
      <button class="btn more" id="logMore" hidden>載入更早的紀錄</button>
    </section>
  </main>
</div>

<script>
const SERVER = 'https://product-shop-status.multi-share-api.workers.dev';
const PRODUCTS = ['家具', '窗簾', '空氣清淨機', '淨水器', '蛋白粉'];
const STATUS = [['call', '已電聯'], ['visit', '已拜訪'], ['no', '無意願'], ['deal', '合作中']];
const SNAME = Object.fromEntries(STATUS);
const COUNTIES = '臺北市 新北市 桃園市 臺中市 臺南市 高雄市 基隆市 新竹市 嘉義市 新竹縣 苗栗縣 彰化縣 南投縣 雲林縣 嘉義縣 屏東縣 宜蘭縣 花蓮縣 臺東縣 澎湖縣 金門縣 連江縣'.split(' ');
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmt = t => { const d = new Date(t); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

let token = load('adminTok');

async function api(path, body) {
  const opt = { headers: { Authorization: 'Bearer ' + token } };
  if (body) { opt.method = 'POST'; opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(SERVER + path, opt); } catch (e) { throw new Error('連不上伺服器，請檢查網路。'); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { logout('登入已失效，請重新登入。'); throw new Error(j.error || '請重新登入'); }
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
const showMsg = t => { $('msg').textContent = t || ''; };

/* ---------- 登入 ---------- */
function showApp(on) { $('app').hidden = !on; $('gate').hidden = on; $('logoutBtn').hidden = !on; if (!on) setTimeout(() => ($('un').value ? $('pw') : $('un')).focus(), 0); }
function logout(msg) { if (typeof hidePw === 'function') hidePw(); token = ''; save('adminTok', ''); $('loginErr').textContent = msg || ''; showApp(false); }
$('logoutBtn').onclick = () => logout('');
$('loginForm').onsubmit = async e => {
  e.preventDefault();
  $('loginBtn').disabled = true; $('loginErr').textContent = '';
  try {
    const r = await fetch(SERVER + '/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: $('un').value.trim(), password: $('pw').value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    token = j.token; save('adminTok', token); $('pw').value = '';
    start();
  } catch (err) {
    $('loginErr').textContent = err.message === 'Failed to fetch' ? '連不上伺服器，請檢查網路。' : err.message;
  } finally { $('loginBtn').disabled = false; }
};

/* ---------- 分頁 ---------- */
let tab = 'status';
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', String(x === b)); });
  ['status', 'users', 'log', 'acct'].forEach(t => $('tab-' + t).hidden = t !== tab);
  showMsg('');
  ({ status: loadStatus, users: loadUsers, log: () => loadLog(false), acct: loadAcct })[tab]();
});

/* ---------- 狀態 ---------- */
let statuses = [], shown = 0, filtered = [];
$('fStatus').innerHTML = '<option value="">全部狀態</option>' + STATUS.map(([k, n]) => `<option value="${k}">${n}</option>`).join('');
['fProd', 'fStatus'].forEach(id => $(id).onchange = renderStatus);
$('fText').oninput = renderStatus;

async function loadStatus() {
  try { statuses = await api('/admin/status'); } catch (e) { showMsg(e.message); return; }
  const prods = [...new Set([...PRODUCTS, ...statuses.map(s => s.p).filter(Boolean)])];
  const cur = $('fProd').value;
  $('fProd').innerHTML = '<option value="">全部產品</option>' + prods.map(p => `<option>${p}</option>`).join('') +
    (statuses.some(s => !s.p) ? '<option value="(舊)">改版前的舊紀錄</option>' : '');
  $('fProd').value = cur;
  renderStatus();
}

function renderStatus() {
  const p = $('fProd').value, s = $('fStatus').value, q = $('fText').value.trim();
  filtered = statuses.filter(r => (!p || (p === '(舊)' ? !r.p : r.p === p)) && (!s || r.s === s) &&
    (!q || [r.name, r.addr, r.by, r.ind].some(v => (v || '').includes(q)))).sort((a, b) => b.t - a.t);
  const counts = STATUS.map(([k, n]) => `${n} ${filtered.filter(r => r.s === k).length}`).join('・');
  $('statusSum').textContent = `共 ${filtered.length} 家（${counts}）`;
  $('statusList').innerHTML = filtered.length ? '' : '<div class="empty">沒有符合的狀態。</div>';
  shown = 0;
  moreStatus();
}
function moreStatus() {
  const end = Math.min(filtered.length, shown + 100);
  for (const r of filtered.slice(shown, end)) $('statusList').appendChild(statusItem(r));
  shown = end;
  $('statusMore').hidden = shown >= filtered.length;
}
$('statusMore').onclick = moreStatus;

function statusItem(r) {
  const it = el('div', 'item');
  it.append(el('b', '', r.name), el('span', 'pill s-' + r.s, SNAME[r.s] || r.s));
  it.append(el('div', 'meta', `${r.p || '（舊紀錄）'}・${r.ind || ''}・${r.addr || (COUNTIES[r.ci] || '') + (r.d || '')}`));
  it.append(el('div', 'meta', `由 ${r.uid ? r.uid + ' ' : ''}${r.by || '（沒有名字）'} 標記・${fmt(r.t)}`));
  const ctl = el('div', 'ctl');
  const sel = el('select');
  sel.setAttribute('aria-label', '修改狀態');
  sel.innerHTML = STATUS.map(([k, n]) => `<option value="${k}">${n}</option>`).join('');
  sel.value = r.s;
  sel.onchange = () => change(r, sel.value, sel);
  const cancel = el('button', 'btn danger', '取消狀態');
  cancel.onclick = () => change(r, '', cancel);
  ctl.append(sel, cancel);
  it.append(ctl);
  return it;
}

async function change(r, s, ctrl) {
  ctrl.disabled = true; showMsg('');
  try {
    await api('/admin/status', { key: r.key, p: r.p || '', s });
    if (s) { r.s = s; r.by = '管理員'; r.t = Date.now(); }
    else statuses = statuses.filter(x => x !== r);
    renderStatus();
  } catch (e) { showMsg('沒有改成功：' + e.message); ctrl.disabled = false; }
}

/* ---------- 使用者 ---------- */
const ROLES = [['lead', '主管'], ['user', '一般'], ['view', '檢視'], ['off', '停用']];
const RNAME = Object.fromEntries(ROLES);
const roleOptions = ROLES.map(([k, n]) => `<option value="${k}">${n}</option>`).join('');
$('newRole').innerHTML = roleOptions;
$('newRole').value = 'user';
async function loadUsers() {
  let users;
  try { users = await api('/admin/users'); } catch (e) { showMsg(e.message); return; }
  const box = $('userList'); box.innerHTML = users.length ? '' : '<div class="empty">還沒有使用者。在上面輸入編號和姓名新增，同事就能登入。</div>';
  for (const u of users) {
    const it = el('div', 'item' + (u.role === 'off' ? ' off' : ''));
    it.append(el('b', '', u.id + ' ' + u.name), el('span', 'pill', RNAME[u.role] || u.role));
    it.style.setProperty('--st', u.role === 'off' ? 'var(--sub)' : u.role === 'lead' ? 'var(--s-visit)' : u.role === 'view' ? 'var(--s-no)' : 'var(--accent)');
    it.append(el('div', 'meta num', `目前標記 ${u.marks} 家・最後登入 ${u.last ? fmt(u.last) : '還沒登入過'}`));
    const edit = el('div', 'edit');
    const id = el('input'); id.value = u.id; id.maxLength = 20; id.setAttribute('aria-label', '使用者編號');
    const nm = el('input', 'nm'); nm.value = u.name; nm.maxLength = 20; nm.setAttribute('aria-label', '姓名');
    const role = el('select'); role.innerHTML = roleOptions; role.value = u.role; role.setAttribute('aria-label', '權限');
    const saveBtn = el('button', 'btn solid', '儲存');
    saveBtn.onclick = async () => {
      saveBtn.disabled = true; showMsg('');
      try { await api('/admin/users', { oldId: u.id, id: id.value.trim(), name: nm.value.trim(), role: role.value }); loadUsers(); }
      catch (e) { showMsg('沒有存成功：' + e.message); saveBtn.disabled = false; }
    };
    const del = el('button', 'btn danger', '刪除');
    del.onclick = async () => {
      if (!del.classList.contains('sure')) { del.classList.add('sure'); del.textContent = '確定刪除？'; setTimeout(() => { del.classList.remove('sure'); del.textContent = '刪除'; }, 4000); return; }
      del.disabled = true;
      try { await api('/admin/users/delete', { id: u.id }); loadUsers(); } catch (e) { showMsg(e.message); del.disabled = false; }
    };
    edit.append(id, nm, role, saveBtn, del);
    it.append(edit);
    box.appendChild(it);
  }
}
$('userForm').onsubmit = async e => {
  e.preventDefault();
  const id = $('newId').value.trim(), name = $('newName').value.trim();
  if (!id || !name) { showMsg('請輸入使用者編號和姓名。'); return; }
  try {
    await api('/admin/users', { id, name, role: $('newRole').value });
    $('newId').value = ''; $('newName').value = ''; $('newRole').value = 'user'; showMsg(''); loadUsers();
  } catch (err) { showMsg(err.message); }
};

/* ---------- 修改紀錄 ---------- */
const RANGES = [['today', '今天'], ['3d', '3 天內'], ['7d', '一週內'], ['30d', '一個月內'], ['all', '全部']];
let lastId = 0, range = 'today';
/* 範圍的起算時間（毫秒）；「今天」從本機今天 0 點算，其他往前推 N 天 */
function sinceOf(r) {
  if (r === 'all') return 0;
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (r === 'today') return d.getTime();
  return Date.now() - parseInt(r, 10) * 864e5;
}
const rangeName = () => Object.fromEntries(RANGES)[range];
RANGES.forEach(([k, n]) => {
  const b = el('button', 'rng' + (k === range ? ' on' : ''), n);
  b.setAttribute('aria-pressed', String(k === range));
  b.onclick = () => {
    range = k;
    document.querySelectorAll('.rng').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b)); });
    resetClear();
    loadLog(false);
  };
  $('logRange').appendChild(b);
});

const clearBtn = $('logClear');
let clearTimer = 0;
function resetClear() { clearTimeout(clearTimer); clearBtn.classList.remove('sure'); clearBtn.textContent = '清除' + (range === 'all' ? '全部' : rangeName() + '的') + '紀錄'; }
clearBtn.onclick = async () => {
  if (!clearBtn.classList.contains('sure')) {
    clearBtn.classList.add('sure');
    clearBtn.textContent = '確定清除？無法復原';
    clearTimer = setTimeout(resetClear, 5000);
    return;
  }
  clearTimeout(clearTimer);
  clearBtn.disabled = true;
  try {
    const r = await api('/admin/log/clear', { since: sinceOf(range) });
    showMsg('');
    resetClear();
    await loadLog(false);
    $('logSum').textContent = `已清除 ${r.deleted} 筆紀錄。`;
  } catch (e) { showMsg('沒有清除成功：' + e.message); resetClear(); }
  finally { clearBtn.disabled = false; }
};
resetClear();

async function loadLog(more) {
  let res;
  const q = '?since=' + sinceOf(range) + (more && lastId ? '&before=' + lastId : '');
  try { res = await api('/admin/log' + q); } catch (e) { showMsg(e.message); return; }
  const rows = res.items;
  $('logSum').textContent = `${rangeName()}共 ${res.total} 筆紀錄`;
  clearBtn.hidden = !res.total;
  const box = $('logList');
  if (!more) box.innerHTML = rows.length ? '' : `<div class="empty">${rangeName()}沒有紀錄。</div>`;
  for (const r of rows) {
    const it = el('div', 'item');
    it.append(el('b', '', r.name || r.key), el('span', 'pill s-' + (r.s || ''), r.s ? SNAME[r.s] : '取消'));
    it.append(el('div', 'meta', `${fmt(r.t)}・${r.uid ? r.uid + ' ' : ''}${r.by || '（沒有名字）'}・${r.p || '（舊紀錄）'}`));
    box.appendChild(it);
  }
  if (rows.length) lastId = rows[rows.length - 1].id;
  $('logMore').hidden = rows.length < 200;
}
$('logMore').onclick = () => loadLog(true);

/* ---------- 帳號設定 ---------- */
async function loadAcct() {
  $('acctMsg').textContent = '';
  try { const a = await api('/admin/account'); $('acctName').textContent = a.username; $('acctUser').value = a.username; }
  catch (e) { showMsg(e.message); }
}
$('acctForm').onsubmit = async e => {
  e.preventDefault();
  const msg = $('acctMsg'); msg.style.color = '';
  const username = $('acctUser').value.trim(), pw = $('acctPw').value, pw2 = $('acctPw2').value, cur = $('acctCur').value;
  if (!username) { msg.textContent = '使用者名稱不能空白。'; return; }
  if (pw !== pw2) { msg.textContent = '兩次輸入的新密碼不一樣。'; return; }
  if (pw && pw.length < 6) { msg.textContent = '新密碼至少要 6 個字。'; return; }
  if (!cur) { msg.textContent = '請輸入目前的密碼。'; return; }
  $('acctSave').disabled = true;
  try {
    const r = await api('/admin/account', { current: cur, username, password: pw });
    token = r.token; save('adminTok', token);
    ['acctPw', 'acctPw2', 'acctCur'].forEach(id => $(id).value = '');
    hidePw();
    $('acctName').textContent = r.username;
    $('un').value = r.username;
    msg.style.color = 'var(--accent)';
    msg.textContent = pw ? '已儲存。下次登入請用新的使用者名稱和密碼。' : '已儲存使用者名稱。';
  } catch (err) { msg.textContent = err.message; }
  finally { $('acctSave').disabled = false; }
};

/* ---------- 密碼欄的眼睛按鈕 ---------- */
const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 5.2A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg>';
document.querySelectorAll('input[type=password]').forEach(inp => {
  const box = el('span', 'pw');
  if (inp.style.flex) { box.style.flex = inp.style.flex; inp.style.flex = ''; }
  inp.replaceWith(box);
  const b = el('button', 'eye');
  b.type = 'button';
  b.innerHTML = EYE;
  b.setAttribute('aria-label', '顯示密碼');
  b.onclick = () => {
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    b.innerHTML = show ? EYE_OFF : EYE;
    b.setAttribute('aria-label', show ? '隱藏密碼' : '顯示密碼');
    inp.focus();
  };
  box.append(inp, b);
});
/* 送出或登出後把密碼欄改回隱藏 */
const hidePw = () => document.querySelectorAll('.pw input').forEach(i => { i.type = 'password'; const b = i.nextSibling; b.innerHTML = EYE; b.setAttribute('aria-label', '顯示密碼'); });

function start() { showApp(true); loadStatus(); }
if (token) start(); else showApp(false);
</script>
