<title>產品找店家</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：一欄三步驟（產品 → 地區 → 產業清單），產業每列一顆「開地圖」 */
:root{
  --bg:#f3f5f4; --card:#ffffff; --ink:#18201d; --sub:#5d6964; --line:#dbe1de;
  --accent:#1d6b57; --accent-ink:#ffffff; --accent-soft:#e1efe9;
  --t-same:#1d6b57; --t-up:#8a6a2c; --t-partner:#3a5f9e; --t-client:#a24a5a;
  --s-call:#2f6fb0; --s-visit:#8a5cb8; --s-no:#7a7f7c; --s-deal:#1f8a4c; --warn:#b3402e;
  --font:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121715; --card:#1b2220; --ink:#e7ece9; --sub:#9aa7a1; --line:#2d3733;
    --accent:#62c4a7; --accent-ink:#0b1714; --accent-soft:#1d322b; color-scheme:dark;
    --t-same:#62c4a7; --t-up:#d4ad62; --t-partner:#7fa6e6; --t-client:#e48a9a;
    --s-call:#6fa8e6; --s-visit:#b892e0; --s-no:#9aa29e; --s-deal:#5cc68a; --warn:#ef8a75;
  }
}
:root[data-theme="dark"]{
  --bg:#121715; --card:#1b2220; --ink:#e7ece9; --sub:#9aa7a1; --line:#2d3733;
  --accent:#62c4a7; --accent-ink:#0b1714; --accent-soft:#1d322b; color-scheme:dark;
    --t-same:#62c4a7; --t-up:#d4ad62; --t-partner:#7fa6e6; --t-client:#e48a9a;
    --s-call:#6fa8e6; --s-visit:#b892e0; --s-no:#9aa29e; --s-deal:#5cc68a; --warn:#ef8a75;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font)}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;margin:0;text-wrap:balance}
.lead{color:var(--sub);margin:4px 0 0;font-size:14px}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  display:flex;flex-direction:column;gap:10px}
.label{font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  padding:7px 15px;font:inherit;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip:focus-visible,.go:focus-visible,select:focus-visible,input:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;min-width:0}
input{flex:1 1 200px}
select{flex:1 1 140px;max-width:220px}
.btn{font:inherit;border:1px solid var(--accent);border-radius:8px;padding:8px 16px;
  background:transparent;color:var(--accent);cursor:pointer}
.list{display:flex;flex-direction:column;gap:16px}
.group{display:flex;flex-direction:column;gap:8px;padding-left:12px;border-left:3px solid var(--tone)}
.group.same{--tone:var(--t-same)} .group.up{--tone:var(--t-up)}
.group.partner{--tone:var(--t-partner)} .group.client{--tone:var(--t-client)}
.group h2{font-size:15px;margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.group h2 span{font-size:12px;font-weight:400;color:var(--sub)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.ind{background:var(--accent-soft);color:var(--ink);border:1px solid var(--line);font:inherit;
  border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.ind .n{color:var(--sub);font-size:12px;margin-left:5px;font-variant-numeric:tabular-nums}
.ind:hover{border-color:var(--accent)}
.ind.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ind.on .n{color:inherit;opacity:.8}
.ind:focus-visible,.go:focus-visible,.more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--sub);font-size:13px;margin:0}
.hint a{color:var(--accent)}
.res-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.res-head h2{font-size:17px;margin:0}
.res-head h2 span{font-size:13px;font-weight:400;color:var(--sub);margin-left:8px;font-variant-numeric:tabular-nums}
.go{background:var(--accent);color:var(--accent-ink);text-decoration:none;border-radius:8px;padding:6px 14px;font-size:14px;white-space:nowrap}
.shops{display:flex;flex-direction:column}
.shop{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.shop:first-child{border-top:0}
.shop b{font-weight:500;min-width:0;word-break:break-word;user-select:all}
.shop .src{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:0 8px;align-self:start;white-space:nowrap}
.shop .addr,.shop .tel{grid-column:1/-1;font-size:13px;color:var(--sub);min-width:0;word-break:break-word}
.shop a{color:var(--accent);text-decoration:none}
.shop a:hover{text-decoration:underline}
.shop .tel{color:var(--ink);font-variant-numeric:tabular-nums}
.more{align-self:center;font:inherit;font-size:14px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:7px 18px;cursor:pointer}
.empty{color:var(--sub);font-size:14px;padding:8px 0}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 -4px;padding:0 4px}
.tab{font:inherit;font-size:14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--sub);padding:8px 10px;cursor:pointer;white-space:nowrap}
.tab .n{font-size:12px;margin-left:4px;font-variant-numeric:tabular-nums}
.tab.on{color:var(--ink);border-bottom-color:var(--st, var(--accent));font-weight:700}
.tab:focus-visible,.st:focus-visible,.user .btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.user{position:relative;flex:none}
.user .btn{padding:6px 12px;font-size:14px}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:150px;box-shadow:0 6px 20px rgb(0 0 0 / .15);font-size:14px}
.btn.solid{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.6;cursor:default}
.gate h2{font-size:18px;margin:0}
.err{color:var(--warn);font-size:14px;margin:0;min-height:1.2em}
.app{display:flex;flex-direction:column;gap:14px}
.st.cancel{--st:var(--warn);border-style:dashed}
.sts{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}
.st{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:2px 10px;cursor:pointer}
.st:hover{border-color:var(--st)}
.st.on{background:var(--st);border-color:var(--st);color:var(--accent-ink)}
.st-note{font-size:12px;color:var(--sub)}
.shop .ind-tag{font-size:11px;color:var(--sub)}
.s-call{--st:var(--s-call)} .s-visit{--st:var(--s-visit)} .s-no{--st:var(--s-no)} .s-deal{--st:var(--s-deal)}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>產品找店家</h1>
      <p class="lead">開發客戶用：選產品和地區，列出可以合作的夥伴和會用到這個產品的潛在客戶，點產業就列出這一區的店家名單。</p>
    </div>
    <div class="user">
      <button class="btn" id="userBtn" hidden aria-haspopup="true" aria-expanded="false"></button>
      <div class="menu" id="userMenu" hidden>
        <span id="userName"></span>
        <button class="btn" id="logout">登出</button>
      </div>
    </div>
  </header>

  <section class="step gate" id="gate" hidden>
    <h2>請先登入</h2>
    <p class="hint">輸入管理員加到名單裡的名字。你標記的狀態會記在這個名字下。</p>
    <form class="row" id="loginForm">
      <input id="loginName" placeholder="你的名字" maxlength="20" autocomplete="username" aria-label="名字">
      <button class="btn solid" id="loginBtn">登入</button>
    </form>
    <p class="err" id="loginErr" role="alert"></p>
  </section>

  <main class="app" id="app" hidden>
  <section class="step">
    <div class="label">產品</div>
    <div class="chips" id="products"></div>
  </section>

  <section class="step">
    <div class="label">地區</div>
    <div class="row">
      <select id="county" aria-label="縣市"></select>
      <select id="district" aria-label="鄉鎮市區"></select>
      <select id="road" aria-label="路名"></select>
    </div>
  </section>

  <section class="step">
    <div class="label" id="indLabel">相關產業</div>
    <div class="list" id="industries"></div>
  </section>

  <section class="step" id="result" hidden>
    <div class="res-head">
      <h2 id="resTitle"></h2>
      <a class="go" id="resMap" target="_blank" rel="noopener">在 Google 地圖找 ↗</a>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="shops" id="shops"></div>
    <button class="more" id="more" hidden>顯示更多</button>
    <p class="hint" id="source"></p>
  </section>
  </main>
</div>

  '臺東縣':'臺東市 成功鎮 關山鎮 卑南鄉 鹿野鄉 池上鄉 東河鄉 長濱鄉 太麻里鄉 大武鄉 綠島鄉 海端鄉 延平鄉 金峰鄉 達仁鄉 蘭嶼鄉',
  '澎湖縣':'馬公市 湖西鄉 白沙鄉 西嶼鄉 望安鄉 七美鄉',
  '金門縣':'金城鎮 金湖鎮 金沙鎮 金寧鄉 烈嶼鄉 烏坵鄉',
  '連江縣':'南竿鄉 北竿鄉 莒光鄉 東引鄉'
};
const districtsOf = c => (AREAS[c] || '').split(' ').filter(Boolean)
  .map(d => /[市鎮鄉區]$/.test(d) ? d : d + '區');

const $ = id => document.getElementById(id);
let product = '家具';

function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function renderProducts() {
  const box = $('products'); box.innerHTML = '';
  Object.keys(PRODUCTS).forEach(p => {
    const b = document.createElement('button');
    b.className = 'chip' + (p === product ? ' on' : '');
    b.textContent = p;
    b.onclick = () => pickProduct(p);
    box.appendChild(b);
  });
}
function pickProduct(p) {
  p = p.trim(); if (!p) return;
  product = p;
  save('product', p);
  current = '';
  $('result').hidden = true;
  renderProducts();
  renderIndustries();
}

function fillCounty() {
  const sel = $('county');
  sel.innerHTML = '<option value="">全台灣</option>' +
    Object.keys(AREAS).map(c => `<option>${c}</option>`).join('');
  const c = load('county');
  sel.value = AREAS[c] ? c : '';
  fillDistrict();
  const d = load('district');
  if (districtsOf(sel.value).includes(d)) $('district').value = d;
}
function fillDistrict() {
  const c = $('county').value, sel = $('district');
  sel.innerHTML = '<option value="">' + (c ? '全部鄉鎮市區' : '先選縣市') + '</option>' +
    districtsOf(c).map(d => `<option>${d}</option>`).join('');
  sel.disabled = !c;
}
$('county').onchange = () => { fillDistrict(); save('county', $('county').value); save('district', ''); road = ''; renderIndustries(); showList(); };
$('district').onchange = () => { save('district', $('district').value); road = ''; renderIndustries(); showList(); };
$('road').onchange = () => { road = $('road').value; render(); };

/* ---------- 路名（從地址取出，例如「基隆路1段」→「基隆路一段」）---------- */
let road = '';
const CN = '零一二三四五六七八九十';
const cnNum = n => n <= 10 ? CN[n] : n < 20 ? '十' + CN[n - 10] : CN[Math.floor(n / 10)] + '十' + (n % 10 ? CN[n % 10] : '');
function roadOf(addr, county, dist) {
  let rest = String(addr || '');
  if (county && rest.startsWith(county)) rest = rest.slice(county.length);
  if (dist && rest.startsWith(dist)) rest = rest.slice(dist.length);
  rest = rest.replace(/^[^\d路街道巷弄號段]{1,4}?[里村](?![路街道])/, '').replace(/^\d+鄰/, '');
  const m = rest.match(/^([^\d]{1,10}?(?:大道|路|街))(?:(\d+|[一二三四五六七八九十]+)段)?/);
  if (!m) return '';
  return m[1] + (m[2] ? (/^\d+$/.test(m[2]) ? cnNum(+m[2]) : m[2]) + '段' : '');
}
function fillRoad(list) {
  const sel = $('road');
  const county = $('county').value, district = $('district').value;
  if (!district || !list) {
    sel.innerHTML = `<option value="">${!district ? '路名（先選鄉鎮市區）' : current ? '全部路段' : '路名（先點產業）'}</option>`;
    sel.disabled = true; road = ''; return;
  }
  const counts = {};
  list.forEach(r => { const x = roadOf(r[3], county, district); if (x) counts[x] = (counts[x] || 0) + 1; });
  const names = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
  if (road && !counts[road]) road = '';
  sel.innerHTML = '<option value="">全部路段</option>' + names.map(n => `<option value="${n}">${n}（${counts[n]}）</option>`).join('');
  sel.value = road;
  sel.disabled = !names.length;
}

/* ---------- 名單資料（site/data，由 build.py 產生）---------- */
const DATA = 'data/';
const SRC = ['公司', '商號', '開放地圖'];
let manifest = null, current = '', currentQ = '', shown = 0, areaRows = [], view = [], listNote = '';
const cache = {};

fetch(DATA + 'manifest.json').then(r => r.json()).then(m => { manifest = m; renderIndustries(); showList(); })
  .catch(() => { manifest = { industries: {}, counties: [] }; renderIndustries(); });

function infoOf(name) { return manifest && manifest.industries[name]; }
function countOf(name) {
  const info = infoOf(name);
  if (!info) return null;
  const ci = manifest.counties.indexOf($('county').value);
  return ci >= 0 ? ((info.c || {})[ci] || 0) : info.n;
}
const mapUrl = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);

function renderIndustries() {
  $('indLabel').textContent = '「' + product + '」相關產業・' + ($('county').value || '全台灣');
  const table = PRODUCTS[product];
  const box = $('industries'); box.innerHTML = '';
  GROUPS.forEach(([key, title, note]) => {
    const items = parse(table[key]);
    if (!items.length) return;
    const g = document.createElement('div');
    g.className = 'group ' + key;
    const h = document.createElement('h2');
    h.textContent = title;
    const s = document.createElement('span');
    s.textContent = note;
    h.appendChild(s);
    const links = document.createElement('div');
    links.className = 'links';
    items.forEach(it => {
      const b = document.createElement('button');
      b.className = 'ind' + (it.name === current ? ' on' : '');
      b.textContent = it.name;
      const n = countOf(it.name);
      if (n !== null) b.insertAdjacentHTML('beforeend', `<span class="n">${n.toLocaleString()}</span>`);
      b.onclick = () => { current = it.name; currentQ = it.q; tab = 'list'; road = ''; renderIndustries(); showList(); $('result').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
      links.appendChild(b);
    });
    g.append(h, links);
    box.appendChild(g);
  });
}

async function loadRows(info, ci) {
  const file = info.split ? `${info.id}-${ci}.json` : `${info.id}.json`;
  if (!cache[file]) cache[file] = fetch(DATA + file).then(r => r.json());
  return cache[file];
}

/* 載入目前產業在所選縣市／鄉鎮的名單，再交給 render() 依路名、狀態分頁顯示 */
async function showList() {
  if (!current) { fillRoad(null); return; }
  const county = $('county').value, district = $('district').value, area = county + district;
  const ci = manifest ? manifest.counties.indexOf(county) : -1;
  $('result').hidden = false;
  $('resMap').href = mapUrl(currentQ + ' ' + (area || '台灣'));
  const info = infoOf(current);
  areaRows = [];
  if (!info || !info.n) {
    listNote = manifest ? '這個產業沒有公開名單可以列出，請按右上「在 Google 地圖找」。' : '名單載入中…';
  } else if (info.split && ci < 0) {
    listNote = `這個產業全台有 ${info.n.toLocaleString()} 家，請先在上方選縣市。`;
  } else {
    listNote = '名單載入中…';
    render();
    const want = current;
    let all;
    try { all = await loadRows(info, ci); } catch (e) { listNote = '名單載入失敗，請重新整理網頁。'; render(); return; }
    if (want !== current) return;
    areaRows = all.filter(r => (ci < 0 || r[1] === ci) && (!district || r[2] === district));
    listNote = areaRows.length ? '' : '這個地區沒有找到，試試放大地區，或按右上「在 Google 地圖找」。';
  }
  fillRoad(info && info.n ? areaRows : null);
  render();
}

/* ---------- 狀態（存在共用伺服器，大家看得到）---------- */
const API = 'https://product-shop-status.multi-share-api.workers.dev/status';
const STATUS = [['call', '已電聯'], ['visit', '已拜訪'], ['no', '無意願'], ['deal', '合作中']];
const STATUS_NAME = Object.fromEntries(STATUS);
let allStatus = [], statuses = {}, statusOk = null, tab = 'list';

/* 目前產品的狀態：key → 紀錄。每個產品各自一筆；改版前的舊紀錄（p 空白）
   顯示在所有包含該產業的產品下 */
function statusMap() {
  const inds = new Set(GROUPS.flatMap(([g]) => parse(PRODUCTS[product][g]).map(i => i.name)));
  const map = {};
  for (const r of allStatus) if (!r.p && inds.has(r.ind)) map[r.key] = r;
  for (const r of allStatus) if (r.p === product) map[r.key] = r;
  return map;
}

/* ---------- 使用者登入（只用名字；名字要先由管理員在後台加入）---------- */
const SERVER = API.replace(/\/status$/, '');
let token = load('tok') || '', me = load('me') || '';
const authHeaders = () => (token ? { Authorization: 'Bearer ' + token } : {});

function showApp(on) {
  $('app').hidden = !on;
  $('gate').hidden = on;
  $('userBtn').hidden = !(on && me && statusOk);
  $('userBtn').textContent = '👤 ' + me;
  $('userName').textContent = '登入身分：' + me;
  if (!on) setTimeout(() => $('loginName').focus(), 0);
}

/* 開網頁時：連得到伺服器就要登入；連不到（例如 Claude 網頁版）就只看名單 */
async function boot() {
  let r;
  try { r = await fetch(API, { cache: 'no-store', headers: authHeaders() }); }
  catch (e) { statusOk = false; showApp(true); if (current) render(); return; }
  if (r.status === 401) { logout(token ? '登入已失效，請重新登入。' : ''); return; }
  if (r.ok) { allStatus = await r.json(); statusOk = true; showApp(true); if (current) render(); }
}

function logout(msg) {
  token = ''; me = '';
  save('tok', ''); save('me', '');
  statusOk = null; allStatus = [];
  $('userMenu').hidden = true;
  $('loginErr').textContent = msg || '';
  showApp(false);
}

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  const name = $('loginName').value.trim();
  if (!name) { $('loginErr').textContent = '請輸入名字。'; return; }
  $('loginBtn').disabled = true;
  $('loginErr').textContent = '';
  try {
    const r = await fetch(SERVER + '/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    token = j.token; me = j.name;
    save('tok', token); save('me', me);
    await boot();
  } catch (err) {
    $('loginErr').textContent = err.message === 'Failed to fetch' ? '連不上伺服器，請檢查網路。' : err.message;
  } finally {
    $('loginBtn').disabled = false;
  }
};
$('userBtn').onclick = () => {
  const open = $('userMenu').hidden;
  $('userMenu').hidden = !open;
  $('userBtn').setAttribute('aria-expanded', String(open));
};
$('logout').onclick = () => logout('');
document.addEventListener('click', e => { if (!e.target.closest('.user')) $('userMenu').hidden = true; });

async function loadStatuses() {
  if (!token || statusOk === false) return;
  try {
    const r = await fetch(API, { cache: 'no-store', headers: authHeaders() });
    if (r.status === 401) { logout('登入已失效，請重新登入。'); return; }
    if (!r.ok) throw new Error(r.status);
    allStatus = await r.json();
  } catch (e) { /* 暫時連不上就沿用舊資料，下次再抓 */ }
  if (current) render();
}
setInterval(() => { if (!document.hidden) loadStatuses(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadStatuses(); });

async function post(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify(body) });
  const j = await r.json();
  if (r.status === 401) { logout(j.error || '請重新登入。'); throw new Error(j.error || '請重新登入'); }
  if (!r.ok) throw new Error(j.error || r.status);
}
/* s：call／visit／no／deal，空字串＝取消 */
async function setStatus(item, s) {
  const prev = statuses[item.key];
  const next = s;
  if ((prev ? prev.s : '') === next) return;
  const by = me;
  const ind = prev && prev.ind && item.src < 0 ? prev.ind : item.ind;
  const rec = { key: item.key, p: product, s: next, by, t: Date.now(), name: item.name, addr: item.addr, ind, ci: item.ci, d: item.d, phone: item.phone };
  // 先在畫面上更新，再送到伺服器
  allStatus = allStatus.filter(r => !(r.key === item.key && (r.p === product || (prev && r.p === prev.p))));
  if (next) allStatus.push(rec);
  render();
  try {
    if (prev && prev.p !== product) await post({ key: item.key, p: prev.p, s: '' });  // 舊紀錄改成這個產品的
    await post(rec);
  } catch (e) {
    flash('狀態沒有存成功（' + e.message + '），請再試一次。');
    await loadStatuses();
  }
}
function flash(msg) {
  const p = document.createElement('div');
  p.className = 'empty';
  p.textContent = msg;
  $('shops').prepend(p);
  setTimeout(() => p.remove(), 6000);
}

/* ---------- 顯示 ---------- */
const itemOfRow = r => ({ name: r[0], ci: r[1], d: r[2], addr: r[3], phone: r[4], src: r[5], key: r[6], lat: r[7], lon: r[8], ind: current });
const itemOfStatus = (key, v) => ({ key, name: v.name, ci: v.ci, d: v.d, addr: v.addr, phone: v.phone, src: -1, ind: v.ind });

function render() {
  if (!current) return;
  statuses = statusMap();
  const county = $('county').value, district = $('district').value;
  const ci = manifest ? manifest.counties.indexOf(county) : -1;
  const inRoad = (addr, d) => !road || roadOf(addr, county, d) === road;
  // 名單分頁：目前產業、還沒有狀態的店家
  const listItems = areaRows.filter(r => !statuses[r[6]] && inRoad(r[3], r[2])).map(itemOfRow);
  // 狀態分頁：這個產品所有產業裡、在所選地區的已標記店家（新標記的在前）
  const marked = Object.entries(statuses)
    .filter(([, v]) => (ci < 0 || v.ci === ci) && (!district || v.d === district) && inRoad(v.addr, v.d))
    .sort((a, b) => b[1].t - a[1].t);
  const byStatus = Object.fromEntries(STATUS.map(([s]) => [s, marked.filter(([, v]) => v.s === s).map(([k, v]) => itemOfStatus(k, v))]));

  const tabs = $('tabs'); tabs.innerHTML = '';
  tabs.hidden = !statusOk;
  if (!statusOk) tab = 'list';
  const mk = (id, label, n, cls) => {
    const b = document.createElement('button');
    b.className = 'tab ' + (cls || '') + (tab === id ? ' on' : '');
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(tab === id));
    b.textContent = label;
    b.insertAdjacentHTML('beforeend', `<span class="n">${n.toLocaleString()}</span>`);
    b.onclick = () => { tab = id; render(); };
    tabs.appendChild(b);
  };
  if (statusOk) {
    mk('list', '名單', listItems.length);
    STATUS.forEach(([s, label]) => mk(s, label, byStatus[s].length, 's-' + s));
  }

  const area = (district || county || '全台灣') + road;
  const title = $('resTitle');
  title.textContent = tab === 'list' ? current : STATUS_NAME[tab];
  const sub = document.createElement('span');
  view = tab === 'list' ? listItems : byStatus[tab];
  sub.textContent = area + '・' + view.length.toLocaleString() + ' 家' + (tab === 'list' ? '' : '（「' + product + '」所有產業）');
  title.appendChild(sub);

  const box = $('shops'); box.innerHTML = '';
  shown = 0;
  let note = '';
  if (tab === 'list') note = listNote || (view.length ? '' : '這一區的店家都已經標記狀態了，可以到上方各狀態分頁查看。');
  else if (!view.length) note = `這個地區還沒有「${STATUS_NAME[tab]}」的店家。在「名單」裡按店家下方的「${STATUS_NAME[tab]}」，就會移到這裡。`;
  if (note) box.innerHTML = `<div class="empty">${note}</div>`;
  more();

  const withPhone = areaRows.filter(r => r[4]).length;
  $('source').innerHTML = (statusOk === false ? '這個網址不能使用狀態功能，請用公開網址 andytsai-000.github.io/product-shop-finder。' : '') +
    `名單來自經濟部商工登記公示資料（沒有電話）與 <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap 貢獻者</a>（部分有電話，本區 ${withPhone} 家）。` +
    (manifest && manifest.updated ? `資料更新：${manifest.updated}。` : '');
}

function card(it) {
  const d = document.createElement('div');
  d.className = 'shop';
  const b = document.createElement('b'); b.textContent = it.name;
  const s = document.createElement('span'); s.className = 'src';
  s.textContent = it.src >= 0 ? SRC[it.src] : it.ind;
  const a = document.createElement('div'); a.className = 'addr';
  const link = document.createElement('a');
  link.target = '_blank'; link.rel = 'noopener';
  link.href = mapUrl(it.addr ? it.name + ' ' + it.addr : (it.lat ? it.lat + ',' + it.lon : it.name));
  link.textContent = it.addr || ((manifest ? manifest.counties[it.ci] || '' : '') + (it.d || '') + '（看地圖位置）');
  a.appendChild(link);
  d.append(b, s, a);
  if (it.phone) { const t = document.createElement('div'); t.className = 'tel'; t.textContent = '電話 ' + it.phone; d.appendChild(t); }
  if (statusOk) {
    const cur = statuses[it.key];
    const row = document.createElement('div'); row.className = 'sts';
    STATUS.forEach(([k, label]) => {
      const btn = document.createElement('button');
      const on = !!(cur && cur.s === k);
      btn.className = 'st s-' + k + (on ? ' on' : '');
      btn.textContent = label;
      btn.setAttribute('aria-pressed', String(on));
      btn.title = on ? '目前的狀態' : '標記為「' + label + '」';
      btn.onclick = () => setStatus(it, k);
      row.appendChild(btn);
    });
    if (cur) {
      const c = document.createElement('button');
      c.className = 'st cancel';
      c.textContent = '取消';
      c.title = '取消狀態，店家回到名單';
      c.onclick = () => setStatus(it, '');
      row.appendChild(c);
      const n = document.createElement('span'); n.className = 'st-note';
      const t = new Date(cur.t);
      n.textContent = (cur.by ? cur.by + '・' : '') + (t.getMonth() + 1) + '/' + t.getDate() + ' 標記';
      row.appendChild(n);
    }
    d.appendChild(row);
  }
  return d;
}

function more() {
  const box = $('shops');
  const end = Math.min(view.length, shown + 100);
  for (const it of view.slice(shown, end)) box.appendChild(card(it));
  shown = end;
  $('more').hidden = shown >= view.length;
  $('more').textContent = `顯示更多（還有 ${(view.length - shown).toLocaleString()} 家）`;
}
$('more').onclick = more;

const saved = load('product');
if (PRODUCTS[saved]) product = saved;
renderProducts();
fillCounty();
fillRoad(null);
renderIndustries();
boot();
</script>
