<title>域見夥伴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：一欄（產品 → 地區 → 相關產業 → 店家名單＋狀態分頁），手機也能用 */
:root{
  --bg:#f3f5f4; --card:#ffffff; --ink:#18201d; --sub:#5d6964; --line:#dbe1de;
  --accent:#1d6b57; --accent-ink:#ffffff; --accent-soft:#e1efe9;
  --t-same:#1d6b57; --t-up:#8a6a2c; --t-partner:#3a5f9e; --t-client:#a24a5a;
  --s-call:#2f6fb0; --s-visit:#8a5cb8; --s-no:#7a7f7c; --s-deal:#1f8a4c; --warn:#b3402e;
  --font:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121715; --card:#1b2220; --ink:#e7ece9; --sub:#9aa7a1; --line:#2d3733;
    --accent:#62c4a7; --accent-ink:#0b1714; --accent-soft:#1d322b; color-scheme:dark;
    --t-same:#62c4a7; --t-up:#d4ad62; --t-partner:#7fa6e6; --t-client:#e48a9a;
    --s-call:#6fa8e6; --s-visit:#b892e0; --s-no:#9aa29e; --s-deal:#5cc68a; --warn:#ef8a75;
  }
}
:root[data-theme="dark"]{
  --bg:#121715; --card:#1b2220; --ink:#e7ece9; --sub:#9aa7a1; --line:#2d3733;
  --accent:#62c4a7; --accent-ink:#0b1714; --accent-soft:#1d322b; color-scheme:dark;
    --t-same:#62c4a7; --t-up:#d4ad62; --t-partner:#7fa6e6; --t-client:#e48a9a;
    --s-call:#6fa8e6; --s-visit:#b892e0; --s-no:#9aa29e; --s-deal:#5cc68a; --warn:#ef8a75;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font)}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;margin:0;text-wrap:balance}
.lead{color:var(--sub);margin:-6px 0 0;font-size:14px}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  display:flex;flex-direction:column;gap:10px}
.label{font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.04em}
.label.sep{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  padding:7px 15px;font:inherit;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip:focus-visible,.go:focus-visible,select:focus-visible,input:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;min-width:0}
input{flex:1 1 200px}
select{flex:1 1 140px;max-width:220px}
.btn{font:inherit;border:1px solid var(--accent);border-radius:8px;padding:8px 16px;
  background:transparent;color:var(--accent);cursor:pointer}
.list{display:flex;flex-direction:column;gap:16px}
.group{display:flex;flex-direction:column;gap:8px;padding-left:12px;border-left:3px solid var(--tone)}
.group.same{--tone:var(--t-same)} .group.up{--tone:var(--t-up)}
.group.partner{--tone:var(--t-partner)} .group.client{--tone:var(--t-client)}
.group h2{font-size:15px;margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.group h2 span{font-size:12px;font-weight:400;color:var(--sub)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.ind{background:var(--accent-soft);color:var(--ink);border:1px solid var(--line);font:inherit;
  border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.ind .n{color:var(--sub);font-size:12px;margin-left:5px;font-variant-numeric:tabular-nums}
.ind:hover{border-color:var(--accent)}
.ind.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ind.on .n{color:inherit;opacity:.8}
.ind:focus-visible,.go:focus-visible,.more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--sub);font-size:13px;margin:0}
.hint a{color:var(--accent)}
.res-sticky{position:sticky;top:0;z-index:3;background:var(--card);margin:-14px -16px 0;padding:12px 16px 8px;
  border-radius:12px 12px 0 0;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.res-sticky.stuck{border-radius:0;box-shadow:0 6px 14px rgb(0 0 0 / .12)}
.res-sticky .tabs{border-bottom:0}
#nameQ{flex:none;width:100%;padding:7px 10px;font-size:14px}
.totop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(96px,calc(env(safe-area-inset-bottom,0px) + 96px));z-index:15;
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgb(0 0 0 / .2)}
.totop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.res-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.res-head h2{font-size:17px;margin:0}
.res-head h2 span{font-size:13px;font-weight:400;color:var(--sub);margin-left:8px;font-variant-numeric:tabular-nums}
.go{background:var(--accent);color:var(--accent-ink);text-decoration:none;border-radius:8px;padding:6px 14px;font-size:14px;white-space:nowrap}
.shops{display:flex;flex-direction:column}
.shop{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:12px 0;border-top:1px solid var(--line)}
.shop:first-child{border-top:0}
.shop b{font-weight:700;font-size:16px;min-width:0;word-break:break-word;user-select:all}
.shop .src{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:0 8px;align-self:start;white-space:nowrap}
.shop .addr,.shop .tel,.shop .links{grid-column:1/-1;font-size:13px;color:var(--sub);min-width:0;word-break:break-word}
.shop a{color:var(--accent);text-decoration:none}
.shop a:hover{text-decoration:underline}
.shop .tel{color:var(--ink);font-variant-numeric:tabular-nums}
.shop .links{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px}
.shop .addr a{color:var(--sub)}
.ic{display:inline-flex;vertical-align:-2px;margin-right:4px}
.shop .addr a:hover{color:var(--accent)}
.shop .links .ph{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500}
.shop .no-mail{color:var(--sub);opacity:.7;cursor:default}
.more{align-self:center;font:inherit;font-size:14px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:7px 18px;cursor:pointer}
.empty{color:var(--sub);font-size:14px;padding:8px 0}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 -4px;padding:0 4px}
.tab{font:inherit;font-size:14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--sub);padding:8px 10px;cursor:pointer;white-space:nowrap}
.tab .n{font-size:12px;margin-left:4px;font-variant-numeric:tabular-nums}
.tab.on{color:var(--ink);border-bottom-color:var(--st, var(--accent));font-weight:700}
.tab:focus-visible,.st:focus-visible,.user .btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.user{position:relative;flex:none}
.user .btn{padding:6px 12px;font-size:14px}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:150px;box-shadow:0 6px 20px rgb(0 0 0 / .15);font-size:14px}
.btn.solid{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.6;cursor:default}
.gate h2{font-size:18px;margin:0}
.err{color:var(--warn);font-size:14px;margin:0;min-height:1.2em}
.app{display:flex;flex-direction:column;gap:14px}
.st.cancel{--st:var(--warn);border-style:dashed}
.st:disabled{cursor:default}
.sts{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}
.st{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:3px 12px;min-height:30px;cursor:pointer}
.st:hover{border-color:var(--st)}
.st.on{background:var(--st);border-color:var(--st);color:var(--accent-ink)}
.st-note{font-size:12px;color:var(--sub)}
.st-other{grid-column:1/-1;font-size:12px;color:var(--warn);margin-top:2px}
.shop .ind-tag{font-size:11px;color:var(--sub)}
.s-call{--st:var(--s-call)} .s-visit{--st:var(--s-visit)} .s-no{--st:var(--s-no)} .s-deal{--st:var(--s-deal)}
.dlg{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:20px;max-width:min(400px,calc(100vw - 32px));box-shadow:0 12px 40px rgb(0 0 0 / .25)}
.dlg::backdrop{background:rgb(0 0 0 / .45)}
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;
  width:max-content;max-width:calc(100vw - 32px);display:flex;align-items:center;gap:12px;
  background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:14px;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.toast button{font:inherit;font-weight:700;background:none;border:0;color:var(--accent-soft);cursor:pointer;padding:2px 4px;white-space:nowrap}
.toast button:focus-visible{outline:2px solid var(--accent-soft);border-radius:4px}
.ind.zero{opacity:.55}
@media (max-width:480px){
  .step{padding:12px 14px}
  .res-sticky{margin:-12px -14px 0;padding:10px 14px 8px}
  .chip{padding:6px 13px}
  .tabs{gap:0}
  .tab{padding:8px 4px;font-size:13px;flex:1 1 auto}
  .tab .n{margin-left:2px}
}
.dlg h2{margin:0 0 10px;font-size:18px;color:var(--warn)}
.dlg p{margin:0 0 8px;line-height:1.6}
.dlg .row{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:14px}
/* 跟進：卡片上的下次聯絡日期＋最新備註、跟進紀錄視窗、上方的待聯絡提醒 */
.fu{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13px;color:var(--sub);margin-top:2px}
.fu .nx{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.nx.due{color:var(--warn)!important}
.fu .nl{min-width:0;flex:1 1 180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fu-btn{font:inherit;font-size:13px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:2px 12px;min-height:28px;cursor:pointer;white-space:nowrap}
.fu-btn:focus-visible,.qd:focus-visible,.dlg .x:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dlg.wide{width:min(520px,calc(100vw - 32px));max-width:none;padding:18px 18px 16px}
.dlg.wide h2{color:var(--ink);font-size:17px;margin:0;padding-right:36px;word-break:break-word}
.dlg .x{position:absolute;right:10px;top:10px;width:36px;height:36px;border:0;background:none;color:var(--sub);font-size:22px;cursor:pointer;border-radius:8px}
.dlg .sub{color:var(--sub);font-size:13px;margin:2px 0 4px}
.dlg .label{display:block;margin:12px 0 6px}
.nx-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nx-row input{flex:0 1 160px}
.qd{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 11px;cursor:pointer}
.qd:hover{border-color:var(--accent)}
.note-form{display:flex;flex-direction:column;gap:6px}
.note-form textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:68px;resize:vertical;width:100%}
.note-form textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note-form .btn{align-self:flex-end}
.dlg .err:empty{display:none}
.notes{display:flex;flex-direction:column;max-height:min(42vh,360px);overflow:auto;margin-top:6px}
.note{padding:8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.note:first-child{border-top:0}
.note p{margin:0;white-space:pre-wrap;word-break:break-word;font-size:14px}
.note .m{font-size:12px;color:var(--sub);display:flex;gap:8px;align-items:center}
.note .del{font:inherit;font-size:12px;border:0;background:none;color:var(--warn);cursor:pointer;padding:2px 4px}
.due-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:10px 14px}
.due-bar.soon{border-left-color:var(--accent)}
.due-bar b{font-size:15px}
.due-bar span{font-size:13px;color:var(--sub)}
.due-list{display:flex;flex-direction:column;max-height:min(60vh,520px);overflow:auto}
.due-item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--sub)}
.due-h + .due-item{border-top:0}
.due-item b{font-size:15px;color:var(--ink);word-break:break-word}
.due-item .nx{align-self:start;white-space:nowrap;font-weight:500;color:var(--ink)}
.due-item .act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:2px}
.due-item a{color:var(--accent);text-decoration:none}
.due-h{font-size:13px;font-weight:700;color:var(--sub);margin:10px 0 2px}
</style>

<button class="totop" id="toTop" hidden aria-label="回到上方">↑</button>
<div class="toast" id="toast" role="status" hidden><span></span><button type="button">復原</button></div>

<dialog class="dlg" id="otherDlg" aria-labelledby="otherTitle">
  <h2 id="otherTitle">⚠️ 你的帳號在其他瀏覽器登入了</h2>
  <p id="otherInfo"></p>
  <p>如果是你自己用另一台電腦或手機登入，可以繼續使用；如果不是你，請馬上聯絡管理員。</p>
  <div class="row">
    <button class="btn" id="otherOut">登出這個瀏覽器</button>
    <button class="btn solid" id="otherOk">我知道了</button>
  </div>
</dialog>

<dialog class="dlg wide" id="fuDlg" aria-labelledby="fuTitle">
  <button class="x" type="button" data-close aria-label="關閉">×</button>
  <h2 id="fuTitle"></h2>
  <p class="sub" id="fuSub"></p>
  <div id="fuNxBox">
    <span class="label">下次聯絡</span>
    <div class="nx-row">
      <input type="date" id="fuNx" aria-label="下次聯絡日期">
      <button class="qd" type="button" data-days="1">明天</button>
      <button class="qd" type="button" data-days="3">3 天後</button>
      <button class="qd" type="button" data-days="7">一週後</button>
      <button class="qd" type="button" id="fuNxClear">清除</button>
    </div>
  </div>
  <p class="hint" id="fuNxRead" hidden></p>
  <span class="label">跟進紀錄</span>
  <form class="note-form" id="fuForm">
    <textarea id="fuText" maxlength="500" placeholder="這次聯絡談了什麼，例如：老闆週一休，下週三下午再打" aria-label="新增跟進紀錄"></textarea>
    <button class="btn solid" id="fuAdd">新增紀錄</button>
  </form>
  <p class="err" id="fuErr" role="alert"></p>
  <div class="notes" id="fuNotes"></div>
</dialog>

<dialog class="dlg wide" id="dueDlg" aria-labelledby="dueTitle">
  <button class="x" type="button" data-close aria-label="關閉">×</button>
  <h2 id="dueTitle">要聯絡的店家</h2>
  <p class="sub">你標記、而且設了「下次聯絡」日期的店家（所有產品）。</p>
  <div class="due-list" id="dueList"></div>
</dialog>

<div class="wrap">
  <header class="top">
    <div>
      <h1>域見夥伴</h1>
    </div>
    <div class="user">
      <button class="btn" id="userBtn" hidden aria-haspopup="true" aria-expanded="false"></button>
      <div class="menu" id="userMenu" hidden>
        <span id="userName"></span>
        <button class="btn" id="logout">登出</button>
      </div>
    </div>
  </header>
  <p class="lead">選產品和地區，列出可以合作的夥伴和會用到這個產品的潛在客戶；點產業就列出這一區的店家名單。</p>

  <section class="step gate" id="gate" hidden>
    <h2>請先登入</h2>
    <p class="hint">輸入管理員給你的使用者編號和姓名。你標記的狀態會顯示你的姓名。</p>
    <form class="row" id="loginForm">
      <input id="loginId" placeholder="使用者編號" maxlength="20" autocomplete="username" aria-label="使用者編號" style="flex:0 1 150px">
      <input id="loginName" placeholder="姓名" maxlength="20" autocomplete="name" aria-label="姓名">
      <button class="btn solid" id="loginBtn">登入</button>
    </form>
    <p class="err" id="loginErr" role="alert"></p>
  </section>

  <main class="app" id="app" hidden>
  <div class="due-bar" id="dueBar" hidden>
    <div><b id="dueText"></b> <span id="dueSub"></span></div>
    <button class="btn" id="dueOpen">查看</button>
  </div>
  <section class="step">
    <div class="label">產品</div>
    <div class="chips" id="products"></div>
    <form class="row" id="searchForm">
      <input id="q" placeholder="或自行輸入產品，例如：沙發" maxlength="20" aria-label="自行輸入產品">
      <button class="btn solid">搜尋</button>
    </form>
    <div class="label sep">地區</div>
    <div class="row">
      <select id="county" aria-label="縣市"></select>
      <select id="district" aria-label="鄉鎮市區"></select>
      <select id="road" aria-label="路名"></select>
    </div>
  </section>

  <section class="step" id="indStep">
    <div class="label" id="indLabel">相關產業</div>
    <div class="list" id="industries"></div>
  </section>

  <section class="step" id="result" hidden>
    <div class="res-sticky" id="resSticky">
    <div class="res-head">
      <h2 id="resTitle"></h2>
      <a class="go" id="resMap" target="_blank" rel="noopener">在 Google 地圖找 ↗</a>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <input type="search" id="nameQ" placeholder="在名單裡找店名、地址或電話" aria-label="在名單裡找店名、地址或電話" maxlength="30">
    </div>
    <div class="shops" id="shops"></div>
    <button class="more" id="more" hidden>顯示更多</button>
    <p class="hint" id="source"></p>
  </section>
  </main>
</div>

<script>
/* 產品 → 依關係分類的相關產業。用「、」分隔，「名稱=搜尋字」可指定送去 Google 地圖的字 */
const GROUPS = [
  ['partner', '合作夥伴', '可以互相介紹客人、一起接案'],
  ['client', '潛在客戶', '會用到這個產品，可以去推銷']
];
const PRODUCTS = {
  '家具': {
    same: '家具行、家具批發、實木家具、訂製家具、二手家具、辦公家具',

function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

/* 問伺服器：這個產品的合作夥伴／潛在客戶是哪些產業（第一次要十幾秒，之後會記住） */
async function loadRelated(p) {
  relErr = '';
  if (CUSTOM[p] || relBusy === p) return;
  try { const c = JSON.parse(load('rel2:' + p) || 'null'); if (c) { CUSTOM[p] = c; renderIndustries(); return; } } catch (e) {}
  if (statusOk === false) { relErr = '自行輸入產品要用公開網址 andytsai-000.github.io/product-shop-finder 才能使用。'; renderIndustries(); return; }
  if (!manifest || !token) { relErr = ''; return; }  // 名單或登入還沒好，好了會再叫一次
  try {
    relBusy = p;
    const r = await fetch(SERVER + '/related', { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ product: p, inds: Object.keys(manifest.industries) }) });
    const j = await r.json();
    if (r.status === 401) { relBusy = ''; logout(j.error || '請重新登入。'); return; }
    if (!r.ok) throw new Error(j.error || r.status);
    CUSTOM[p] = { partner: j.partner.join('、'), client: j.client.join('、') };
    save('rel2:' + p, JSON.stringify(CUSTOM[p]));
  } catch (e) {
    relErr = e.message === 'Failed to fetch' ? '連不上伺服器，請檢查網路後再按一次搜尋。' : e.message;
  }
  relBusy = '';
  if (p === product) renderIndustries();
}

/* ---------- 路名（從地址取出，例如「基隆路1段」→「基隆路一段」）---------- */
let road = '';
const CN = '零一二三四五六七八九十';
const cnNum = n => n <= 10 ? CN[n] : n < 20 ? '十' + CN[n - 10] : CN[Math.floor(n / 10)] + '十' + (n % 10 ? CN[n % 10] : '');
function roadOf(addr, county, dist) {
  let rest = String(addr || '');
  if (county && rest.startsWith(county)) rest = rest.slice(county.length);
  if (dist && rest.startsWith(dist)) rest = rest.slice(dist.length);
  rest = rest.replace(/^[^\d路街道巷弄號段]{1,4}?[里村](?![路街道])/, '').replace(/^\d+鄰/, '');
  const m = rest.match(/^([^\d]{1,10}?(?:大道|路|街))(?:(\d+|[一二三四五六七八九十]+)段)?/);
  if (!m) return '';
  return m[1] + (m[2] ? (/^\d+$/.test(m[2]) ? cnNum(+m[2]) : m[2]) + '段' : '');
}
function fillRoad(list) {
  const sel = $('road');
  const county = $('county').value, district = $('district').value;
  if (!district || !list) {
    sel.innerHTML = `<option value="">${!district ? '路名（先選鄉鎮市區）' : current ? '全部路段' : '路名（先點產業）'}</option>`;
    sel.disabled = true; road = ''; return;
  }
  const counts = {};
  list.forEach(r => { const x = roadOf(r[3], county, district); if (x) counts[x] = (counts[x] || 0) + 1; });
  const names = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
  if (road && !counts[road]) road = '';
  sel.innerHTML = '<option value="">全部路段</option>' + names.map(n => `<option value="${n}">${n}（${counts[n]}）</option>`).join('');
  sel.value = road;
  sel.disabled = !names.length;
}

/* ---------- 名單資料（site/data，由 build.py 產生）---------- */
const DATA = 'data/';
const SRC = ['公司', '商號', '開放地圖'];
let manifest = null, current = '', currentQ = '', shown = 0, areaRows = [], view = [], listNote = '';
const cache = {};

fetch(DATA + 'manifest.json').then(r => r.json()).then(m => { manifest = m; renderIndustries(); showList(); if (isCustom()) loadRelated(product); })
  .catch(() => { manifest = { industries: {}, counties: [] }; renderIndustries(); });

function infoOf(name) { return manifest && manifest.industries[name]; }
function countOf(name) {
  const info = infoOf(name);
  if (!info) return null;
  const ci = manifest.counties.indexOf($('county').value);
  return ci >= 0 ? ((info.c || {})[ci] || 0) : info.n;
}
const mapUrl = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);

function renderIndustries() {
  $('indLabel').textContent = '「' + product + '」相關產業・' + ($('county').value || '全台灣');
  const table = tableOf(product);
  const box = $('industries'); box.innerHTML = '';
  if (!table) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = relErr || '正在判斷「' + product + '」跟哪些產業有關，第一次大約要 15 秒…';
    box.appendChild(e);
    return;
  }
  GROUPS.forEach(([key, title, note]) => {
    const items = parse(table[key]);
    if (!items.length) return;
    const g = document.createElement('div');
    g.className = 'group ' + key;
    const h = document.createElement('h2');
    h.textContent = title;
    const s = document.createElement('span');
    s.textContent = note;
    h.appendChild(s);
    const links = document.createElement('div');
    links.className = 'links';
    items.forEach(it => {
      const b = document.createElement('button');
      const n = countOf(it.name);
      b.className = 'ind' + (it.name === current ? ' on' : '') + (n === 0 ? ' zero' : '');
      b.textContent = it.name;
      if (n !== null) b.insertAdjacentHTML('beforeend', `<span class="n">${n.toLocaleString()}</span>`);
      b.onclick = () => { current = it.name; currentQ = it.q; tab = 'list'; road = ''; renderIndustries(); showList(); $('result').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
      links.appendChild(b);
    });
    g.append(h, links);
    box.appendChild(g);
  });
}

async function loadRows(info, ci) {
  const file = info.split ? `${info.id}-${ci}.json` : `${info.id}.json`;
  if (!cache[file]) cache[file] = fetch(DATA + file).then(r => r.json());
  return cache[file];
}

/* 載入目前產業在所選縣市／鄉鎮的名單，再交給 render() 依路名、狀態分頁顯示 */
async function showList() {
  $('nameQ').value = '';
  if (!current) { fillRoad(null); return; }
  const county = $('county').value, district = $('district').value, area = county + district;
  const ci = manifest ? manifest.counties.indexOf(county) : -1;
  $('result').hidden = false;
  $('resMap').href = mapUrl(currentQ + ' ' + (area || '台灣'));
  const info = infoOf(current);
  areaRows = [];
  if (!info || !info.n) {
    listNote = manifest ? '這個產業沒有公開名單可以列出，請按右上「在 Google 地圖找」。' : '名單載入中…';
  } else if (info.split && ci < 0) {
    listNote = `這個產業全台有 ${info.n.toLocaleString()} 家，請先在上方選縣市。`;
  } else {
    listNote = '名單載入中…';
    render();
    const want = current;
    let all;
    try { all = await loadRows(info, ci); } catch (e) { listNote = '名單載入失敗，請重新整理網頁。'; render(); return; }
    if (want !== current) return;
    areaRows = all.filter(r => (ci < 0 || r[1] === ci) && (!district || r[2] === district));
    listNote = areaRows.length ? '' : '這個地區沒有找到，試試放大地區，或按右上「在 Google 地圖找」。';
  }
  fillRoad(info && info.n ? areaRows : null);
  render();
}

/* 目前產品的狀態：key → 紀錄。每個產品各自一筆；改版前的舊紀錄（p 空白）
   顯示在所有包含該產業的產品下 */
function statusMap() {
  const table = tableOf(product) || {};
  if (isCustom()) return Object.fromEntries(allStatus.filter(r => r.p === product).map(r => [r.key, r]));
  const inds = new Set(GROUPS.flatMap(([g]) => parse(table[g]).map(i => i.name)));

  for (const r of allStatus) if (!r.p && inds.has(r.ind)) map[r.key] = r;

/* s：call／visit／no／deal，空字串＝取消 */
async function setStatus(item, s) {
  const prev = statuses[item.key];
  const next = s;
  if ((prev ? prev.s : '') === next) return;
  if (!canEdit(prev)) { flash(me && me.role === 'view' ? '你的權限只能查看，不能標記。' : `這筆是 ${prev.by} 標記的，只有本人或後台可以修改。`); return; }
  const by = me.name, uid = me.id;
  const ind = prev && prev.ind && item.src < 0 ? prev.ind : item.ind;
  const rec = { key: item.key, p: product, s: next, by, uid, t: Date.now(), name: item.name, addr: item.addr, ind, ci: item.ci, d: item.d, phone: item.phone };
  // 換狀態時，伺服器會保留下次聯絡日期，跟進紀錄也還在
  if (prev && prev.p === product) Object.assign(rec, { nx: prev.nx, nn: prev.nn, nl: prev.nl });
  // 先在畫面上更新，再送到伺服器
  allStatus = allStatus.filter(r => !(r.key === item.key && (r.p === product || (prev && r.p === prev.p))));
  if (next) allStatus.push(rec);
  render(true);
  try {
    if (prev && prev.p !== product) await post({ key: item.key, p: prev.p, s: '' });  // 舊紀錄改成這個產品的
    await post(rec);
  } catch (e) {
    flash('狀態沒有存成功（' + e.message + '），請再試一次。');
    await loadStatuses();
    return;
  }
  // 店家會移到別的分頁，告訴使用者去哪了，並可以復原
  const undo = !prev || prev.p === product ? () => setStatus(item, prev ? prev.s : '') : null;
  flash(next ? `「${item.name}」已標記為「${STATUS_NAME[next]}」，可到「${STATUS_NAME[next]}」分頁查看。` : `已取消「${item.name}」的狀態，回到名單。`, undo);
}
/* ---------- 跟進紀錄＋下次聯絡日期（只有標記的人可以寫，別人可以看）---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const WEEK = '日一二三四五六';
/* 2026-11-25 → 「今天聯絡」「明天聯絡・11/21（六）」「已過 2 天・…」「下次聯絡 11/25（三）」 */
function nxText(nx) {
  const [y, m, d] = nx.split('-').map(Number);
  const day = new Date(y, m - 1, d), now = new Date(); now.setHours(0, 0, 0, 0);
  const diff = Math.round((day - now) / 864e5);
  const md = m + '/' + d + '（' + WEEK[day.getDay()] + '）';
  return diff === 0 ? '今天聯絡' : diff === 1 ? '明天聯絡・' + md : diff < 0 ? '已過 ' + -diff + ' 天・' + md : '下次聯絡 ' + md;
}
const fmtT = t => { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
/* 自己標的（一般權限）才能寫紀錄、設日期 */
const ownRec = rec => !!(me && me.role === 'user' && rec && rec.uid === me.id);

  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(j.error || '請重新登入。'); throw new Error(j.error || '請重新登入'); }
  if (!r.ok) throw new Error(j.error || r.status);

}
const errText = e => e.message === 'Failed to fetch' ? '連不上伺服器，請檢查網路。' : e.message;

/* ---------- 顯示 ---------- */
const itemOfRow = r => ({ name: r[0], ci: r[1], d: r[2], addr: r[3], phone: r[4], src: r[5], key: r[6], lat: r[7], lon: r[8], ct: r[9] || {}, ind: current });
const itemOfStatus = (key, v) => ({ key, name: v.name, ci: v.ci, d: v.d, addr: v.addr, phone: v.phone, src: -1, ind: v.ind });

/* keep：保留目前已展開的筆數和捲動位置（自動更新、標記時用） */
function render(keep) {

  const ci = manifest ? manifest.counties.indexOf(county) : -1;

  const listItems = areaRows.filter(r => !statuses[r[6]] && inRoad(r[3], r[2])).map(itemOfRow);
  // 狀態分頁：這個產品所有產業裡、在所選地區的已標記店家（新標記的在前）
  const marked = Object.entries(statuses)
    .filter(([, v]) => (ci < 0 || v.ci === ci) && (!district || v.d === district) && inRoad(v.addr, v.d))
    .sort((a, b) => b[1].t - a[1].t);

    b.onclick = () => { tab = id; render(); toResult(); };
    tabs.appendChild(b);
  };
  if (statusOk) {
    mk('list', '名單', listItems.length);
    STATUS.forEach(([s, label]) => mk(s, label, byStatus[s].length, 's-' + s));
  }

  const area = (district || county || '全台灣') + road;

  const sub = document.createElement('span');

  sub.textContent = area + '・' + (nq ? '符合 ' + view.length.toLocaleString() + ' / ' : '') + all.length.toLocaleString() + ' 家' + (tab === 'list' ? '' : '（「' + product + '」所有產業）');

  let note = '';
  if (nq && all.length && !view.length) note = `找不到符合「${nq}」的店家。`;
  else if (tab === 'list') note = listNote || (view.length ? '' : '這一區的店家都已經標記狀態了，可以到上方各狀態分頁查看。');
  else if (!view.length) note = `這個地區還沒有「${STATUS_NAME[tab]}」的店家。在「名單」裡按店家下方的「${STATUS_NAME[tab]}」，就會移到這裡。`;
  if (note) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = note; box.appendChild(e); }
  do more(); while (shown < Math.min(keepN, view.length));
  if (keep) scrollTo(0, keepY);

  const withPhone = areaRows.filter(r => r[4]).length;
  $('source').innerHTML = (statusOk === false ? '這個網址不能使用狀態功能，請用公開網址 andytsai-000.github.io/product-shop-finder。' : '') +
    `名單來自經濟部商工登記公示資料（沒有電話）與 <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap 貢獻者</a>（部分有電話、信箱、粉專，本區有電話 ${withPhone} 家）。` +
    (manifest && manifest.updated ? `資料更新：${manifest.updated}。` : '');
}

/* 卡片上的小圖示（跟著文字顏色） */
const ICONS = {
  pin: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  fb: '<path d="M15 3h-2a4 4 0 0 0-4 4v3H7v4h2v7h4v-7h3l1-4h-4V7a1 1 0 0 1 1-1h2z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  web: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'
};
function icon(name) {
  const i = document.createElement('span'); i.className = 'ic';
  i.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
  return i;
}

function card(it) {
  const d = document.createElement('div');
  d.className = 'shop';
  const b = document.createElement('b'); b.textContent = it.name;
  const s = document.createElement('span'); s.className = 'src';
  s.textContent = it.src >= 0 ? SRC[it.src] : it.ind;
  const a = document.createElement('div'); a.className = 'addr';
  const link = document.createElement('a');
  link.target = '_blank'; link.rel = 'noopener';
  link.href = mapUrl(it.addr ? it.name + ' ' + it.addr : (it.lat ? it.lat + ',' + it.lon : it.name));
  link.append(icon('pin'), it.addr || ((manifest ? manifest.counties[it.ci] || '' : '') + (it.d || '') + '（看地圖位置）'));
  a.appendChild(link);
  d.append(b, s, a);
  // 信箱、粉專、官網：開放地圖有才顯示；沒有粉專就給「找粉專」（用店名＋縣市搜尋 Facebook）
  const ct = it.ct || {}, ln = document.createElement('div'); ln.className = 'links';
  const add = (href, ic, text, title) => {
    const x = document.createElement('a'); x.href = href; x.append(icon(ic), text); x.title = title;
    if (!href.startsWith('mailto:')) { x.target = '_blank'; x.rel = 'noopener'; }
    ln.appendChild(x);
  };
  if (it.phone) add('tel:' + it.phone.replace(/[^\d+#]/g, ''), 'phone', it.phone, '撥打電話');  // 手機上點了直接撥號
  if (ln.lastChild) ln.lastChild.className = 'ph';
  if (ct.e) add('mailto:' + ct.e, 'mail', ct.e, '寄信');
  else { const x = document.createElement('span'); x.className = 'no-mail'; x.append(icon('mail'), '無信箱'); x.title = '公開資料沒有這家店的信箱'; ln.appendChild(x); }
  if (ct.f) add(ct.f, 'fb', '粉絲專頁', '打開 Facebook 粉絲專頁');
  else add('https://www.google.com/search?q=' + encodeURIComponent(it.name + ' ' + (manifest ? manifest.counties[it.ci] || '' : '') + ' facebook'), 'search', '找粉專', '用店名搜尋 Facebook 粉絲專頁');
  if (ct.w) add(ct.w, 'web', '官網', '打開官方網站');
  d.appendChild(ln);
  if (statusOk) {
    const cur = statuses[it.key];
    const editable = canEdit(cur);
    const row = document.createElement('div'); row.className = 'sts';
    STATUS.forEach(([k, label]) => {
      if (!editable && !(cur && cur.s === k)) return;  // 不能改的只顯示目前狀態
      const btn = document.createElement('button');
      const on = !!(cur && cur.s === k);
      btn.className = 'st s-' + k + (on ? ' on' : '');
      btn.textContent = label;
      btn.setAttribute('aria-pressed', String(on));
      btn.title = on ? '目前的狀態' : '標記為「' + label + '」';
      if (editable) btn.onclick = () => setStatus(it, k); else btn.disabled = true;
      row.appendChild(btn);
    });
    if (cur && editable) {
      const c = document.createElement('button');
      c.className = 'st cancel';
      c.textContent = '取消';
      c.title = '取消狀態，店家回到名單';
      c.onclick = () => setStatus(it, '');
      row.appendChild(c);
    }
    if (cur) {
      const n = document.createElement('span'); n.className = 'st-note';
      const t = new Date(cur.t);
      n.textContent = '由 ' + (cur.by || '（未記名）') + ' 標記・' + (t.getMonth() + 1) + '/' + t.getDate();
      row.appendChild(n);
    }
    if (row.childNodes.length) d.appendChild(row);
    if (cur) {
      // 跟進：下次聯絡日期、最新一則紀錄；自己標的可以寫，別人標的有紀錄才能看
      const fu = document.createElement('div'); fu.className = 'fu';
      if (cur.nx) { const x = document.createElement('span'); x.className = 'nx' + (cur.nx <= today() ? ' due' : ''); x.textContent = '📅 ' + nxText(cur.nx); fu.appendChild(x); }
      if (cur.nl) { const x = document.createElement('span'); x.className = 'nl'; x.textContent = '📝 ' + cur.nl; x.title = cur.nl; fu.appendChild(x); }
      if (ownRec(cur) || cur.nn) {
        const x = document.createElement('button'); x.className = 'fu-btn';
        x.textContent = cur.nn ? '跟進紀錄 ' + cur.nn : '寫跟進紀錄';
        x.onclick = () => openFollow(cur);
        fu.appendChild(x);
      }
      if (fu.childNodes.length) d.appendChild(fu);
    }
    // 同一家店在其他產品被標過：提醒一下，避免類似產品重複開發同一家
    const others = allStatus.filter(r => r.key === it.key && r !== cur && r.p !== product);
    if (others.length) {
      const o = document.createElement('div'); o.className = 'st-other';
      o.textContent = '⚠ ' + others.map(r => {
        const t = new Date(r.t);
        const [act, who] = OTHER_TEXT[r.s] || ['已標記「' + r.s + '」', '標記者'];
        return '此店家已有其他產品' + (r.p ? '(' + r.p + ')' : '') + '人員' + act + '(' + who + '：' + (r.by || '未記名') + (t.getMonth() + 1) + '/' + t.getDate() + ')';
      }).join('；');
      d.appendChild(o);
    }
  }
  return d;
}

function more() {
  const box = $('shops');
  const end = Math.min(view.length, shown + 100);
  for (const it of view.slice(shown, end)) box.appendChild(card(it));
  shown = end;
  $('more').hidden = shown >= view.length;
  $('more').textContent = `顯示更多（還有 ${(view.length - shown).toLocaleString()} 家）`;
}
$('more').onclick = more;
$('nameQ').oninput = () => render();
/* 切換分頁時，如果已經往下捲，回到名單開頭 */
function toResult() {
  const top = $('result').getBoundingClientRect().top;
  if (top < 0) scrollTo(0, scrollY + top - 8);
}
/* 捲動時：名單標題貼在上方時加陰影；捲很下面時出現「回到上方」 */
addEventListener('scroll', () => {
  const r = $('result');
  $('resSticky').classList.toggle('stuck', !r.hidden && r.getBoundingClientRect().top < 0);
  $('toTop').hidden = scrollY < 900;
}, { passive: true });
$('toTop').onclick = () => scrollTo({ top: 0, behavior: 'smooth' });

const saved = load('product');
if (saved && saved.length <= 20) product = saved;
renderProducts();
fillCounty();
fillRoad(null);
renderIndustries();
boot();
</script>
